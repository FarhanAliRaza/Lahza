[package]
name = "lahza"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Lahza: a Linux-first screenshot and recording studio built with Rust and GPUI"

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "2"

[workspace.dependencies]
ash = "=0.38.0"
ashpd = { version = "=0.12.3", default-features = false, features = ["async-std"] }
async-io = "=2.6.0"
base64 = "=0.22.1"
blade-graphics = "=0.7.1"
blade-macros = "=0.3.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
chrono = { version = "=0.4.43", default-features = false, features = ["clock", "serde"] }
futures-util = "=0.3.34"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
gstreamer = "=0.25.3"
gstreamer-video = "=0.25.3"
image = "=0.25.10"
lahza-annotations = { path = "crates/annotations" }
libc = "0.2"
libspa-sys = "=0.9.2"
log = "=0.4.34"
naga = { version = "=25.0.1", features = ["wgsl-in"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
pipewire = "=0.9.2"
kurbo = "=0.11.3"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rustfft = "=6.4.1"
rustybuzz = "=0.20.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tract-linalg = { version = "=0.22.5", features = ["multithread-mm"] }
tract-onnx = "=0.22.5"
ttf-parser = "=0.25.1"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.13.3"
uuid = { version = "=1.25.0", features = ["serde", "v4"] }
x11rb = { version = "=0.13.2", features = ["randr", "shape"] }

[dependencies]
lahza-annotations = { workspace = true }
lahza-recording = { path = "crates/recording" }
lahza-motion-core = { path = "crates/motion-core" }
lahza-motion-mcp = { path = "crates/motion-mcp" }
lahza-motion-render = { path = "crates/motion-render" }
ashpd = { workspace = true }
async-io = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
gpui = { workspace = true }
futures-util = { workspace = true }
gstreamer = { workspace = true }
image = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustfft = { workspace = true }
unicode-segmentation = { workspace = true }
uuid = { workspace = true }
x11rb = { workspace = true }

[profile.dev]
debug = 1
opt-level = 1

[dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
blade-graphics = { path = "vendor/blade-graphics" }
tract-onnx = { path = "vendor/tract-onnx" }
