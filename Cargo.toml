[package]
name = "lahza"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Lahza: a Linux-first screenshot and recording studio built with Rust and GPUI"

[dependencies]
ashpd = { version = "=0.12.3", default-features = false, features = ["async-std"] }
async-io = "=2.6.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.43", default-features = false, features = ["clock", "serde"] }
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
futures-util = "=0.3.34"
gstreamer = "=0.25.3"
image = "=0.25.10"
libc = "0.2"
pipewire = "=0.9.2"
libspa-sys = "=0.9.2"
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.25.0", features = ["serde", "v4"] }

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
