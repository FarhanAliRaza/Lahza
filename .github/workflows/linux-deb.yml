name: Build Linux Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            jq \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-base-apps \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pipewire \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Create DEB package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "screendrop") | .version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "v${version}" ]]; then
            echo "Release tag must match Cargo.toml version ${version}" >&2
            exit 1
          fi
          architecture="$(dpkg --print-architecture)"
          package_name="screendrop_${version}_${architecture}"
          package_root="dist/${package_name}"

          install -Dm755 target/release/screendrop "${package_root}/usr/bin/screendrop"
          strip "${package_root}/usr/bin/screendrop"
          install -Dm644 packaging/com.screendrop.Screendrop.desktop \
            "${package_root}/usr/share/applications/com.screendrop.Screendrop.desktop"
          install -Dm644 Lahza.png \
            "${package_root}/usr/share/pixmaps/com.screendrop.Screendrop.png"
          install -d "${package_root}/usr/share/screendrop/assets"
          cp -a assets/. "${package_root}/usr/share/screendrop/assets/"
          chmod -R go-w "${package_root}/usr/share/screendrop/assets"
          install -d "${package_root}/DEBIAN"

          cat > "${package_root}/DEBIAN/control" <<EOF
          Package: screendrop
          Version: ${version}
          Architecture: ${architecture}
          Maintainer: Lahza contributors <noreply@github.com>
          Homepage: https://github.com/FarhanAliRaza/lahza
          Section: graphics
          Priority: optional
          Depends: ffmpeg, gstreamer1.0-libav, gstreamer1.0-pipewire, gstreamer1.0-plugins-good, gstreamer1.0-tools, gstreamer1.0-plugins-base-apps, libgstreamer1.0-0, libpipewire-0.3-0, libx11-6, libxkbcommon-x11-0, libxkbcommon0, xdg-desktop-portal
          Description: Lahza screenshot and recording studio for Linux
           Capture, annotate, and export screenshots and screen recordings.
          EOF

          dpkg-deb --build --root-owner-group "${package_root}" "dist/${package_name}.deb"
          echo "file=dist/${package_name}.deb" >> "$GITHUB_OUTPUT"
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Create binary bundle and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "screendrop") | .version')"
          bundle="lahza-${version}-linux-x86_64"
          bundle_root="dist/${bundle}"
          install -Dm755 target/release/screendrop "${bundle_root}/bin/screendrop"
          strip "${bundle_root}/bin/screendrop"
          install -Dm755 packaging/install.sh "${bundle_root}/install.sh"
          install -Dm644 README.md "${bundle_root}/README.md"
          install -Dm644 packaging/com.screendrop.Screendrop.desktop \
            "${bundle_root}/share/applications/com.screendrop.Screendrop.desktop"
          install -Dm644 Lahza.png \
            "${bundle_root}/share/icons/hicolor/512x512/apps/com.screendrop.Screendrop.png"
          install -d "${bundle_root}/share/screendrop/assets"
          cp -a assets/. "${bundle_root}/share/screendrop/assets/"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS

      - name: Inspect package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.file }}"
          dpkg-deb --contents "${{ steps.package.outputs.file }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: packaging/RELEASE-NOTES.md
          generate_release_notes: true
