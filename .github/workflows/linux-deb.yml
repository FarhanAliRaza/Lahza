name: Build Linux Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            jq \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-base-apps \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pipewire \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: |
          cargo test --release --locked
          python3 -m unittest discover -s packaging/tests

      - name: Create DEB package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lahza") | .version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "v${version}" ]]; then
            echo "Release tag must match Cargo.toml version ${version}" >&2
            exit 1
          fi
          architecture="$(dpkg --print-architecture)"
          package_name="lahza_${version}_${architecture}"
          package_root="dist/${package_name}"

          install -Dm755 target/release/lahza "${package_root}/usr/bin/lahza"
          install -Dm755 packaging/lahza-update "${package_root}/usr/bin/lahza-update"
          strip "${package_root}/usr/bin/lahza"
          install -Dm644 packaging/com.lahza.Lahza.desktop \
            "${package_root}/usr/share/applications/com.lahza.Lahza.desktop"
          sed -i 's|^Exec=lahza$|Exec=/usr/bin/lahza|' \
            "${package_root}/usr/share/applications/com.lahza.Lahza.desktop"
          install -Dm644 Lahza.png \
            "${package_root}/usr/share/pixmaps/com.lahza.Lahza.png"
          install -d "${package_root}/usr/share/lahza/assets"
          cp -a assets/. "${package_root}/usr/share/lahza/assets/"
          chmod -R go-w "${package_root}/usr/share/lahza/assets"
          install -d "${package_root}/DEBIAN"

          cat > "${package_root}/DEBIAN/control" <<EOF
          Package: lahza
          Version: ${version}
          Architecture: ${architecture}
          Maintainer: Lahza contributors <noreply@github.com>
          Homepage: https://github.com/FarhanAliRaza/lahza
          Section: graphics
          Priority: optional
          Depends: python3, ca-certificates, ffmpeg, gstreamer1.0-libav, gstreamer1.0-pipewire, gstreamer1.0-plugins-good, gstreamer1.0-tools, gstreamer1.0-plugins-base-apps, libgstreamer1.0-0, libpipewire-0.3-0, libx11-6, libxkbcommon-x11-0, libxkbcommon0, xdg-desktop-portal
          Description: Lahza screenshot and recording studio for Linux
           Capture, annotate, and export screenshots and screen recordings.
          EOF

          dpkg-deb --build --root-owner-group "${package_root}" "dist/${package_name}.deb"
          echo "file=dist/${package_name}.deb" >> "$GITHUB_OUTPUT"
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Create binary bundle and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lahza") | .version')"
          bundle="lahza-${version}-linux-x86_64"
          bundle_root="dist/${bundle}"
          install -Dm755 target/release/lahza "${bundle_root}/bin/lahza"
          strip "${bundle_root}/bin/lahza"
          install -Dm755 packaging/install.sh "${bundle_root}/install.sh"
          install -Dm644 README.md "${bundle_root}/README.md"
          install -Dm644 packaging/com.lahza.Lahza.desktop \
            "${bundle_root}/share/applications/com.lahza.Lahza.desktop"
          install -Dm644 Lahza.png \
            "${bundle_root}/share/icons/hicolor/512x512/apps/com.lahza.Lahza.png"
          install -d "${bundle_root}/share/lahza/assets"
          cp -a assets/. "${bundle_root}/share/lahza/assets/"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS

      - name: Inspect package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.file }}"
          dpkg-deb --contents "${{ steps.package.outputs.file }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: packaging/RELEASE-NOTES.md
          generate_release_notes: true

  build-snap:
    name: Build and test Snap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      file: ${{ steps.metadata.outputs.file }}
      channel: ${{ steps.metadata.outputs.channel }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate release version
        id: metadata
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"Release tag must match Cargo.toml version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"file=lahza_{version}_amd64.snap", file=output)
              print(f"channel={'beta' if '-' in version else 'stable'}", file=output)
          PY

      - name: Build Snap in managed Ubuntu 24.04 environment
        id: snapcraft
        uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          snapcraft-channel: 8.x/stable

      - name: Collect Snap and checksum
        id: package
        env:
          BUILT_SNAP: ${{ steps.snapcraft.outputs.snap }}
          SNAP_FILE: ${{ steps.metadata.outputs.file }}
        run: |
          test "$(basename "$BUILT_SNAP")" = "$SNAP_FILE"
          mkdir -p dist
          cp "$BUILT_SNAP" "dist/$SNAP_FILE"
          cd dist
          sha256sum "$SNAP_FILE" > SNAP-SHA256SUMS

      - name: Install and test confined Snap
        env:
          SNAP_FILE: ${{ steps.metadata.outputs.file }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          sudo snap install --dangerous "dist/$SNAP_FILE"
          snap connections lahza
          test "$(snap run lahza --version)" = "Lahza $VERSION"
          snap run --shell lahza -c 'exec "$SNAP/snap/command-chain/gpu-2404-wrapper" "$SNAP/snap/command-chain/desktop-launch" bash -s' \
            < packaging/snap-smoke-test.sh | tee dist/snap-smoke-test.log

      - name: Upload Snap and test log
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lahza-snap-amd64
          path: |
            dist/*.snap
            dist/SNAP-SHA256SUMS
            dist/snap-smoke-test.log
          if-no-files-found: error

  publish-snap:
    name: Publish tested Snap
    needs: [build-deb, build-snap]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: snap-publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download tested Snap
        uses: actions/download-artifact@v4
        with:
          name: lahza-snap-amd64
          path: dist

      - name: Verify artifact checksum
        working-directory: dist
        run: sha256sum -c SNAP-SHA256SUMS

      - name: Attach Snap to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.snap dist/SNAP-SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Check Snap Store credential
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo "::error::Set the SNAPCRAFT_STORE_CREDENTIALS repository secret. See packaging/SNAP.md."
            exit 1
          fi

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable

      - name: Publish to Snap Store
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist/${{ needs.build-snap.outputs.file }}
          release: ${{ needs.build-snap.outputs.channel }}
