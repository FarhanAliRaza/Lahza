name: Build Linux DEB

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            jq \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create DEB package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "screendrop") | .version')"
          architecture="$(dpkg --print-architecture)"
          package_name="screendrop_${version}_${architecture}"
          package_root="dist/${package_name}"

          install -Dm755 target/release/screendrop "${package_root}/usr/bin/screendrop"
          strip "${package_root}/usr/bin/screendrop"
          install -Dm644 packaging/com.screendrop.Screendrop.desktop \
            "${package_root}/usr/share/applications/com.screendrop.Screendrop.desktop"
          install -Dm644 Lahza.png \
            "${package_root}/usr/share/pixmaps/com.screendrop.Screendrop.png"
          install -d "${package_root}/usr/share/screendrop/assets"
          cp -a assets/. "${package_root}/usr/share/screendrop/assets/"
          chmod -R go-w "${package_root}/usr/share/screendrop/assets"
          install -d "${package_root}/DEBIAN"

          cat > "${package_root}/DEBIAN/control" <<EOF
          Package: screendrop
          Version: ${version}
          Architecture: ${architecture}
          Maintainer: Screendrop contributors <noreply@github.com>
          Homepage: https://github.com/FarhanAliRaza/screendrop-rs
          Section: graphics
          Priority: optional
          Depends: ffmpeg, gstreamer1.0-pipewire, gstreamer1.0-plugins-good, gstreamer1.0-tools, libgstreamer1.0-0, libpipewire-0.3-0, libx11-6, libxkbcommon-x11-0, libxkbcommon0, xdg-desktop-portal
          Description: Linux screenshot and recording studio
           Capture, annotate, and export screenshots and screen recordings.
          EOF

          dpkg-deb --build --root-owner-group "${package_root}" "dist/${package_name}.deb"
          echo "file=dist/${package_name}.deb" >> "$GITHUB_OUTPUT"
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Inspect package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.file }}"
          dpkg-deb --contents "${{ steps.package.outputs.file }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

      - name: Attach DEB to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.file }}
          generate_release_notes: true
