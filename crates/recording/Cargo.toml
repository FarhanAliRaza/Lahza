lahza-studio-overlays = { path = "../studio-overlays" }
lahza-teleprompter = { path = "../teleprompter" }
lahza-templates = { path = "../templates" }
lahza-temporal-decode = { path = "../temporal-decode" }
lahza-transcript = { path = "../transcript" }
lahza-transcription = { path = "../transcription" }
lahza-video = { path = "../video" }
lahza-viewport = { path = "../viewport" }

[dev-dependencies]
lahza-media = { path = "../media", features = ["test-support"] }
lahza-playback = { path = "../playback", features = ["test-support"] }
gstreamer = { workspace = true }
image = { workspace = true }
uuid = { workspace = true }
